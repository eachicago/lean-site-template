name: github pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'

      # Never fail the deploy over this: if Google is unreachable the site
      # falls back to the embedded calendar iframe, which is fine.
      # Runs on every build, so a deploy always ships a current list. There is
      # deliberately no schedule: GitHub disables scheduled workflows after 60
      # days of repository inactivity, so a nightly refresh would stop exactly
      # when it mattered. js/events.js keeps the list current between deploys.
      - name: Refresh events from Google Calendar
        continue-on-error: true
        run: |
          CAL_ID=$(sed -n 's/^ *googleCalendarId *= *"\(.*\)"/\1/p' config.toml | head -1)
          TZ_ID=$(sed -n 's/^ *timezone *= *"\(.*\)"/\1/p' config.toml | head -1)
          echo "calendar: $CAL_ID  tz: $TZ_ID"
          python3 scripts/build_events.py "$CAL_ID" --tz "${TZ_ID:-America/Chicago}" --limit 12

      - name: Build
        run: |
          rm -rf public
          hugo
          cp CNAME public/

      # Only publish from master. Without this guard the pull_request
      # trigger above would deploy an unmerged branch straight to the
      # live site.
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
